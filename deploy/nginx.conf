worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css text/plain image/svg+xml;
    client_max_body_size 20m;

    # 非 root、只读根文件系统下，临时文件仅写入 tmpfs。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # 使用 Docker DNS 重新解析后端地址，支持后端容器重建后地址变化。
    upstream lambo_backend {
        zone lambo_backend 64k;
        resolver 127.0.0.11 valid=10s ipv6=off;
        server backend:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/$is_args$args;
        }

        # 保留既有的后端进程健康检查入口。
        location = /api/healthz {
            proxy_pass http://lambo_backend/healthz;
            proxy_next_upstream off;
        }

        # 保留 /api 前缀，与主服务登录及生成的业务路由一致。
        location ^~ /api/ {
            proxy_pass http://lambo_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
            proxy_next_upstream off;
        }

        # 版本化静态资源长期缓存；缺失资源返回 404，不返回 HTML。
        location ~* ^/(?:assets|css|js|jse|woff|woff2|ttf|otf|eot|svg|png|jpg|jpeg|webp|gif|ico)/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        # Vben 的全局 API 配置文件不缓存，避免升级后沿用旧配置。
        location ~ ^/_app-config.*\.js$ {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location ~ /\. {
            deny all;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
